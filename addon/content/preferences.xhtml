<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>

<!-- ── Section 1: PDF Extraction ── -->
<groupbox>
  <label><html:h2>MinerU 设置</html:h2></label>

  <hbox align="center" style="margin-bottom: 6px">
    <label style="width: 110px; min-width: 110px">API Token</label>
    <html:input
      type="password"
      id="__addonRef__-mineru-token"
      preference="extensions.zotero.paperworm.mineru.apiToken"
      placeholder="在 mineru.net 申请 API Token"
      style="flex: 1; padding: 2px 4px"
    />
  </hbox>

  <hbox align="center" style="margin-top: 6px">
    <button id="__addonRef__-mineru-test-btn" label="测试连接" />
    <label id="__addonRef__-mineru-test-result" style="margin-left: 10px" />
  </hbox>

  <vbox style="margin-left: 8px; margin-top: 8px">
    <description style="font-size: 0.9em; color: #666">
      填入 MinerU API Token 后，PaperWorm 面板将显示"⚡
      精细提取"按钮，可按需提取结构化文本（表格、公式等），结果缓存为 Zotero
      笔记，自动跨设备同步。
    </description>
  </vbox>
</groupbox>

<!-- ── Section 2: LLM Service ── -->
<!-- onload 必须挂在真实容器元素上，不能挂在自闭合元素上 -->
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-llm-section"></html:h2></label>

  <!-- Provider selector -->
  <hbox align="center" style="margin-bottom: 6px">
    <label
      data-l10n-id="pref-provider-label"
      style="width: 110px; min-width: 110px"
    />
    <menulist
      id="__addonRef__-provider"
      preference="extensions.zotero.paperworm.llm.provider"
      style="flex: 1"
    >
      <menupopup>
        <menuitem value="openai" label="OpenAI" />
        <menuitem value="openai-siwc" label="OpenAI（ChatGPT 订阅）" />
        <menuitem value="deepseek" label="DeepSeek" />
        <menuitem value="anthropic" label="Anthropic (Claude)" />
        <menuitem value="gemini" label="Google Gemini" />
        <menuitem value="ollama" label="Ollama（本地）" />
        <menuitem value="kimi" label="Kimi（月之暗面）" />
        <menuitem value="qwen" label="阿里云百炼" />
        <menuitem value="openrouter" label="OpenRouter" />
        <menuitem value="mimo" label="MiMo（小米）" />
        <menuitem value="minimax" label="MiniMax" />
        <menuitem value="zhipu" label="智谱 GLM" />
      </menupopup>
    </menulist>
  </hbox>

  <!-- OpenAI -->
  <vbox id="__addonRef__-section-openai" style="margin-left: 8px">
    <hbox align="center" style="margin-bottom: 4px">
      <label
        data-l10n-id="pref-apikey-label"
        style="width: 110px; min-width: 110px"
      />
      <html:input
        type="password"
        id="__addonRef__-openai-apikey"
        preference="extensions.zotero.paperworm.llm.openai.apiKey"
        style="flex: 1; padding: 2px 4px"
      />
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-model-label"
        style="width: 110px; min-width: 110px"
      />
      <html:input
        type="text"
        id="__addonRef__-openai-models"
        preference="extensions.zotero.paperworm.llm.openai.models"
        placeholder="逗号分隔的模型列表"
        style="flex: 1; padding: 2px 4px"
      />
      <button
        class="pw-fetch-models-btn"
        data-provider="openai"
        data-l10n-id="pref-fetch-models-btn"
        style="margin-left: 4px; min-width: 0"
      />
    </hbox>
  </vbox>

  <!-- OpenAI（ChatGPT 订阅，SIWC：OAuth 登录，无 API Key）-->
  <vbox
    id="__addonRef__-section-openai-siwc"
    style="margin-left: 8px"
    hidden="true"
  >
    <!-- 态④：登录已过期横幅 -->
    <hbox
      id="__addonRef__-siwc-reauth-banner"
      hidden="true"
      align="center"
      style="margin-bottom: 6px"
    >
      <description flex="1" style="color: #c0392b">
        ⚠ 登录已过期，请重新登录
      </description>
      <button id="__addonRef__-siwc-reauth-btn" label="重新登录" />
    </hbox>
    <!-- 态①：未登录 -->
    <vbox id="__addonRef__-siwc-signed-out">
      <description style="margin-bottom: 8px; max-width: 46em">
        使用你的 ChatGPT 订阅额度（Plus/Pro 等），无需 API Key；与上方
        "OpenAI"（按量 API）互不影响。登录将在浏览器中完成。
      </description>
      <html:button
        id="__addonRef__-siwc-login-btn"
        class="pw-siwc-login-btn"
        style="
          background: #000;
          color: #fff;
          border: none;
          border-radius: 5px;
          padding: 7px 16px;
          font-size: 13px;
          cursor: pointer;
        "
        >Continue with ChatGPT</html:button
      >
    </vbox>
    <!-- 态②：等待授权 -->
    <vbox id="__addonRef__-siwc-pending" hidden="true">
      <description style="margin-bottom: 6px">
        ⟳ 已在浏览器打开授权页面，完成后将自动返回 Zotero…（10 分钟内有效）
      </description>
      <button
        id="__addonRef__-siwc-cancel-btn"
        label="取消"
        style="max-width: 90px"
      />
      <vbox style="margin-top: 8px">
        <description style="margin-bottom: 4px; font-size: 11px; color: gray">
          若浏览器显示“无法访问此页面 /
          未发送任何数据”：请勿关闭该页面，复制地址栏中的完整链接，粘贴到下方完成登录（链接一次性有效）。
        </description>
        <hbox align="center">
          <html:input
            type="text"
            id="__addonRef__-siwc-manual-input"
            placeholder="http://127.0.0.1:23120/paperworm/auth-callback?code=…"
            style="flex: 1; padding: 2px 4px"
          />
          <button
            id="__addonRef__-siwc-manual-btn"
            label="完成登录"
            style="margin-left: 4px; min-width: 80px"
          />
        </hbox>
      </vbox>
    </vbox>
    <!-- 态③：已登录 -->
    <vbox id="__addonRef__-siwc-signed-in" hidden="true">
      <hbox align="center" style="margin-bottom: 6px">
        <description flex="1" id="__addonRef__-siwc-account"
          >● 已登录</description
        >
        <button id="__addonRef__-siwc-logout-btn" label="断开连接" />
      </hbox>
      <hbox align="center">
        <label
          data-l10n-id="pref-model-label"
          style="width: 110px; min-width: 110px"
        />
        <html:input
          type="text"
          id="__addonRef__-openai-siwc-models"
          preference="extensions.zotero.paperworm.llm.openai-siwc.models"
          placeholder="逗号分隔的模型列表"
          style="flex: 1; padding: 2px 4px"
        />
        <button
          class="pw-fetch-models-btn"
          data-provider="openai-siwc"
          data-l10n-id="pref-fetch-models-btn"
          style="margin-left: 4px; min-width: 0"
        />
      </hbox>
      <html:div style="margin-top: 6px; font-size: 11px; color: gray">
        用量与额度管理：
        <html:a
          id="__addonRef__-siwc-manage-link"
          style="cursor: pointer; text-decoration: underline"
          >Manage usage</html:a
        >
      </html:div>
    </vbox>
    <html:div
      id="__addonRef__-siwc-status"
      style="margin-top: 6px; font-size: 11px; color: #c0392b"
    ></html:div>
  </vbox>

<!-- ── Section 3: Vision Assistant ── -->
<groupbox>
  <label><html:h2>视觉辅助模型（可选）</html:h2></label>

  <vbox style="margin-left: 8px; margin-bottom: 8px">
    <description style="font-size: 0.9em; color: #666">
      主聊天模型会优先直接识别截图；若其不支持图片输入，自动降级由此视觉模型转述后再交给主模型。未配置时以"图片识别失败"占位符提示，不影响主聊天。API
      Key 自动复用「LLM 服务配置」中已保存的对应提供商密钥，无需重复填写。
    </description>
  </vbox>

  <hbox align="center" style="margin-bottom: 6px">
    <label style="width: 110px; min-width: 110px">视觉提供商</label>
    <menulist
      id="__addonRef__-vision-provider"
      preference="extensions.zotero.paperworm.llm.vision.provider"
      style="flex: 1"
    >
      <menupopup>
        <menuitem value="" label="不启用" />
        <menuitem value="kimi" label="Kimi（月之暗面）" />
      </menupopup>
    </menulist>
  </hbox>

  <hbox align="center" style="margin-bottom: 6px">
    <label style="width: 110px; min-width: 110px">视觉模型</label>
    <html:input
      type="text"
      id="__addonRef__-vision-model"
      preference="extensions.zotero.paperworm.llm.vision.model"
      style="flex: 1; padding: 2px 4px"
      placeholder="如 kimi-k2.6、moonshot-v1-128k-vision-preview"
    />
  </hbox>
</groupbox>

<!-- ── Section 4: Prompts ── -->
<groupbox>

  <!-- 系统提示词 -->

      <menupopup>
        <menuitem value="__blank__" label="自定义（清空）" />
        <menuitem value="unlocker" label="开锁专家" />
        <menuitem value="academic" label="学术阅读助手" />
        <menuitem value="translate" label="翻译模式" />
        <menuitem value="critical" label="批判性分析" />
        <menuitem value="notes" label="研究笔记助手" />
        <menuseparator id="__addonRef__-user-template-sep" hidden="true" />
      </menupopup>
    </menulist>
    <button
      id="__addonRef__-apply-template"
      data-l10n-id="pref-apply-template"
      style="margin-left: 6px"
    />
    <button
      id="__addonRef__-delete-template"
      label="删除"
      disabled="true"
      style="margin-left: 4px"
    />
    <button
      id="__addonRef__-saveas-template"
      label="另存为"
      style="margin-left: 4px"
    />
  </hbox>

  <hbox
    id="__addonRef__-save-row"
    hidden="true"
    align="center"
    style="margin-bottom: 4px"
  >
    <label value="模板名称：" style="width: 110px; min-width: 110px" />
    <html:input
      type="text"
      id="__addonRef__-template-name-input"
      placeholder="输入模板名称"
      style="flex: 1; padding: 2px 4px"
    />
    <button
      id="__addonRef__-confirm-save"
      label="保存"
      style="margin-left: 6px"
    />
    <button
      id="__addonRef__-cancel-save"
      label="取消"
      style="margin-left: 4px"
    />
  </hbox>
  <label
    id="__addonRef__-save-error"
    hidden="true"
    style="color: red; font-size: 0.85em; margin-bottom: 4px"
  />

  <html:textarea
    id="__addonRef__-system-prompt"
    preference="extensions.zotero.paperworm.systemPrompt.content"
    rows="8"
    style="
      width: 100%;
      padding: 6px;
      font-family: monospace;
      font-size: 0.9em;
      resize: vertical;
    "
  ></html:textarea>

  <!-- 分隔线 -->
  <separator
    style="
      margin-top: 12px;
      margin-bottom: 8px;
      border-top: 1px solid rgba(128, 128, 128, 0.2);
    "
  />

  <!-- 总结全文提示词 -->
  <label
    data-l10n-id="pref-summarize-prompt-sublabel"
    style="font-weight: 600; margin-bottom: 6px; opacity: 0.7; font-size: 0.9em"
  />

  <html:textarea
    preference="extensions.zotero.paperworm.action.summarizePrompt"
    rows="3"
    placeholder="请对这篇论文做一个结构化总结，包括：研究问题、方法、主要发现、贡献和局限性。&#10;&#10;论文标题：{title}"
    style="
      width: 100%;
      padding: 4px 6px;
      font-size: 0.9em;
      resize: vertical;
      font-family: inherit;
    "
  ></html:textarea>
  <label
    value="可用变量：{title}  {authors}  {year}  {abstract}  {doi}"
    style="margin-top: 3px; opacity: 0.5; font-size: 0.85em"
  />
</groupbox>

<!-- ── Section 5: Custom Action Buttons ── -->
<groupbox>
  <label><html:h2>自定义快捷按钮</html:h2></label>

  <vbox style="margin-left: 8px; margin-bottom: 8px">
    <description style="font-size: 0.9em; color: #666">
      添加后将在 PaperWorm 主面板的动作按钮区显示对应按钮（0
      个不显示）；点击按钮会把提示词填入输入框（不自动发送）。支持变量：{title}
      {authors} {year} {abstract} {doi}
    </description>
  </vbox>

  <!-- 已配置按钮列表（动态渲染） -->
  <vbox
    id="__addonRef__-custom-btn-list"
    style="margin-left: 8px; margin-bottom: 8px"
  />

  <!-- 添加表单 -->
  <hbox align="center" style="margin-bottom: 4px">
    <label value="按钮名称" style="width: 110px; min-width: 110px" />
    <html:input
      type="text"
      id="__addonRef__-custom-btn-name"
      placeholder="如：提取创新点（最多 16 字）"
      style="flex: 1; padding: 2px 4px"
    />
  </hbox>
  <label value="提示词" style="margin-bottom: 2px" />
  <html:textarea
    id="__addonRef__-custom-btn-prompt"
    rows="3"
    placeholder="点击按钮后填入输入框的提示词，可使用 {title} 等变量"
    style="
      width: 100%;
      padding: 4px 6px;
      font-size: 0.9em;
      resize: vertical;
      font-family: inherit;
    "
  ></html:textarea>
  <hbox align="center" style="margin-top: 6px">
    <button id="__addonRef__-custom-btn-save" label="添加按钮" />
    <label
      id="__addonRef__-custom-btn-error"
      hidden="true"
      style="color: red; margin-left: 10px; font-size: 0.9em"
    />
  </hbox>
</groupbox>

<!-- ── Footer ── -->
<vbox>
  <label
    style="opacity: 0.5; font-size: 0.85em; margin-top: 4px"
    data-l10n-id="pref-help"
    data-l10n-args='{"name":"__addonName__","version":"__buildVersion__"}'
  />
</vbox>
