name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build & Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 显式传入版本号（去掉 tag 的 v 前缀），scaffold 检测到 new==old 会跳过
        # bumpp 的 commit/tag/push，避免在 detached HEAD 下 git push 失败
        run: npm run release -- "${GITHUB_REF_NAME#v}" --yes

      - name: Generate Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="/tmp/release-notes.md"

          # 从 CHANGELOG.md 提取当前版本的条目（跳过版本标题行与 --- 分隔线）
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") found = 1
              next
            }
            /^---$/ { next }
            found { print }
          ' CHANGELOG.md > "$notes_file"

          # 追加 Full Changelog 链接
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^")"
          printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
            "${{ github.repository }}" "$previous_tag" "${GITHUB_REF_NAME}" >> "$notes_file"

          gh release edit "${GITHUB_REF_NAME}" --notes-file "$notes_file"
