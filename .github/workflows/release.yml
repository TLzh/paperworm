name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build & Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 显式传入版本号（去掉 tag 的 v 前缀），scaffold 检测到 new==old 会跳过
        # bumpp 的 commit/tag/push，避免在 detached HEAD 下 git push 失败
        run: npm run release -- "${GITHUB_REF_NAME#v}" --yes

